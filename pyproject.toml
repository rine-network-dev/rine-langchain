[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-rine"
description = "Native LangChain / LangGraph tools for the Rine network — send, receive, discover, and run E2E-encrypted agent-to-agent conversations and groups from a LangChain / LangGraph agent"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.11"
authors = [{ name = "mmmbs", email = "mmmbs@proton.me" }]
keywords = ["rine", "langchain", "langgraph", "agents", "tools", "e2ee", "messaging", "ai-agents"]
# Single source of truth: __init__.py reads __version__ from importlib.metadata.version(
# "langchain-rine"), so the installed metadata (this literal) is the only version string.
version = "0.8.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    # Dev/CI consume the LOCAL ./rine-sdk (editable path dep injected inside the rig via the
    # `--override rine @ file:///work/rine-sdk` — see compose.langchain.yml + Dockerfile +
    # entrypoint.sh). That editable SDK carries any unreleased fixes. The published floor
    # below is the *intended* runtime pin; the rig installs ./rine-sdk over this entry,
    # so the pin is documented, not active in dev. Signing (rine_pay) needs the SDK's
    # `payments` extra — see the `payments` extra below.
    #
    # PUBLISHED FLOOR 0.11.0, and unlike every floor before it this one is NOT
    # documentation-grade — it is a hard import requirement. These tools import names the
    # SDK first exported in 0.11.0 (`describe_mls_admission`, `own_agents_clause`,
    # `GroupCreateWithRoster`, `GroupTarget`, `VOTE_ELECTORATE_RULE` among others), so
    # against 0.10.0 `import langchain_rine` raises ImportError at module scope. Lower
    # this floor and the package does not fail a call — it fails to load.
    #
    # 0.11.0 also inherits 0.10.0's reason for existing: it is at or above the first rine
    # whose send path fetches the recipient's signing key fresh instead of reading a
    # cached copy, so a peer that rotates its key is sent to under the new key on the very
    # next message rather than up to ten minutes later. A seal is one-shot and reports
    # nothing back, so a message sealed to a stale key is simply unreadable for its
    # recipient — nothing in these tools can detect or retry that.
    "rine>=0.11.0",
    "langchain-core>=1.0,<2.0",  # exact min verified
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://rine.network"
Documentation = "https://docs.rine.network"
Repository = "https://codeberg.org/rine/rine-langchain"
Issues = "https://codeberg.org/rine/rine-langchain/issues"

[project.optional-dependencies]
# v0.2 Tier-3 idle-wake resumer. LangGraph is NOT a core runtime dep — attaching the
# 21 tools to any framework must not force langgraph. Importing `langchain_rine.inbound` IS
# the opt-in; this extra supplies langgraph + the durable sqlite checkpointer the resumer's
# caller-owned `SqliteSaver` lifecycle needs. (The resumer's own thread-map uses stdlib sqlite3.)
inbound = [
    "langgraph>=1.2,<2.0",                 # resolved 1.2.4 — interrupt()/Command + Agent-Inbox schema
    "langgraph-checkpoint-sqlite>=3.0,<4", # resolved 3.1.0 — SqliteSaver/AsyncSqliteSaver (durable)
    "aiosqlite>=0.20",                     # resolved 0.22.1 — async SqliteThreadMap store
]
# rine_pay signs an EIP-3009 authorization, which needs the SDK's optional `payments`
# extra (eth-account). rine_fulfill (payee) does NOT sign — it only needs base `rine`.
# Install `langchain-rine[payments]` to enable paying.
payments = [
    "rine[payments]>=0.11.0",
]
# Pins resolved + verified inside the rig.
# Resolved set (2026-06-11): langchain-core 1.4.4 · langchain 1.3.7 · langchain-tests 1.1.9 ·
# langgraph 1.2.4 · langchain-openai 1.3.0 · pydantic 2.13.4 · pytest 9.0.3 · pytest-asyncio 1.4.0.
dev = [
    "pytest>=8.0",            # langchain-tests forces >=9.0.3 transitively; resolved 9.0.3
    "respx>=0.22",            # resolved 0.23.1
    # `langchain` meta-pkg provides langchain.agents.create_agent. It is NOT pulled
    # transitively by langchain-tests / langgraph / langchain-openai — it MUST be explicit.
    "langchain>=1.0,<2.0",
    "langchain-tests==1.1.9", # pinned EXACTLY (conformance claim); brings pytest 9.x + pytest-asyncio 1.x + pytest-socket
    "langgraph>=1.2,<2.0",    # resolved 1.2.4
    "langgraph-checkpoint-sqlite>=3.0,<4",  # resolved 3.1.0 — durable SqliteSaver for the Tier-3 resumer tests (v0.2)
    "aiosqlite>=0.20",        # resolved 0.22.1 — async SqliteThreadMap store tests (v0.3)
    "langchain-openai>=1.0,<2.0",  # resolved 1.3.0 (e2e live-LLM agent)
    "ruff>=0.8",              # resolved 0.15.16
    "mypy>=1.13",             # resolved 2.1.0 (mypy 2.x)
    # x402 payer signing: the rine_pay tests exercise the real EIP-3009 sign path, so the
    # dev/rig env always carries the SDK's (otherwise optional) `payments` extra. Listed
    # directly (not via `rine[payments]`) because the rig `--override rine @ file://…` pins
    # the SDK source and would drop the extra marker. Mirrors rine-sdk's own dev extra.
    "eth-account>=0.13.0,<0.14",
]

[tool.hatch.build.targets.sdist]
# .gitignore does NOT govern sdist contents — this list does. `uv.lock` is excluded
# for the same reason as in rine-hermes: this lock pins `rine` 0.2.2 while pyproject
# floors on >=0.11.0, so a contributor who syncs from the sdist installs an SDK that
# predates `is_authenticity_failure` and fails at import. The sdist's own METADATA
# carries the real floor; a lock is only ever as fresh as its last re-lock.
exclude = ["phases/", "e2e/", "tests/", "examples/", ".e2e.env", "*.env", ".uv-cache/", ".venv/", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_rine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# REQUIRED: the langchain-tests ToolsIntegrationTests base class ships
# `async def test_async_invoke_*` cases. Without auto asyncio mode they ERROR with
# "async def functions are not natively supported". pytest-asyncio arrives via langchain-tests.
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "TCH",
    "D101", "D102", "D103", "D107", "D205", "D400",
]
ignore = ["D100"]

[tool.ruff.lint.per-file-ignores]
# Test classes/methods carry self-documenting `test_<what>_<when>_<expected>`
# names; per-symbol docstrings would be noise. Module + most method docstrings
# are still written by hand, but the rule is not enforced here.
"tests/**" = ["D101", "D102", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# The type gate checks the LOWEST interpreter this package supports, so
# `requires-python = ">=3.11"` above is a claim the gate actually validates. The
# rig's own interpreter is 3.12 (Dockerfile FROM python:3.12-slim); checking at
# 3.11 there is exactly the point — a 3.12-only construct in this package is a
# type error a 3.12-only gate would wave through.
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["langchain_rine"]
mypy_path = "src"

# numpy's installed stub uses PEP 695 `type X = …`, which mypy refuses to parse
# under `python_version = 3.11`. That is a syntax error in a THIRD-PARTY stub,
# and mypy treats it as fatal — "errors prevented further checking" — so the
# whole gate aborts before it reads a line of langchain_rine. Skipping the import
# (numpy is a transitive dependency of langchain's vector-store tree; this package
# never names it) keeps the gate running at the floor it ships.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
